<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DigitalBurj — offline</title>
<style>
  :root { color-scheme: dark; }
  body { margin:0; min-height:100svh; display:grid; place-items:center; background:radial-gradient(circle at 20% 20%,#2563eb55,transparent 45%),radial-gradient(circle at 80% 80%,#e1061355,transparent 45%),#070d1b; color:#eef2ff; font:500 16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif; text-align:center; padding:24px; }
  img { width:72px; height:72px; border-radius:18px; background:#fff; }
  h1 { font-size:clamp(2rem,7vw,3.2rem); letter-spacing:-.04em; margin:.6em 0 .2em; }
  p { color:#b8c3dc; max-width:34ch; margin:0 auto 1.6em; }
  button { font:700 15px system-ui; border:0; border-radius:999px; padding:14px 22px; background:#e10613; color:#fff; cursor:pointer; }
</style>
</head>
<body>
<main>
  <img src="/brand/db-iconmark.png" alt="DigitalBurj" />
  <h1>You are offline.</h1>
  <p>DigitalBurj will pick up where you left off as soon as your connection returns.</p>
  <button onclick="location.reload()">Try again</button>
</main>
</body>
</html>
